[workspace]
channels = ["conda-forge"]
name = "gm-ptp-solution"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
placement = "python -m ptp placement examples/demo.json --output results/demo/placement.json"
ranking = "python -m ptp ranking examples/demo.json --placement results/demo/placement.json --output results/demo/ranking.json"
test = "python -m pytest -q --basetemp=.pytest-tmp"
lint = "ruff check ptp tests"

[dependencies]
python = "3.13.*"
networkx = ">=3.7,<4"
lxml = ">=6.1.3,<7"
numpy = ">=2.5.3,<3"
pytest = ">=9.1.1,<10"
ruff = ">=0.16.10,<0.17"
scipy = ">=1.18.1,<2"
